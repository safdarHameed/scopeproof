services:
  db:
    image: postgres:16-alpine
    container_name: scopeproof-db
    environment:
      POSTGRES_USER: scopeproof
      POSTGRES_PASSWORD: scopeproof
      POSTGRES_DB: scopeproof
    ports:
      - "5433:5432"   # 5433 on host to avoid clashing with a local Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scopeproof"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
